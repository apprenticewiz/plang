name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a branch makes the run already going on it redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_VERSION: '22'

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      # gcc-14 and gcc-15 are both here to hold the README to "GCC >= 14".
      # They are the versions that reject, and then crash on, lambdas taking an
      # explicit object parameter that name a member of the enclosing class;
      # this builds without one, and these two runs are what keeps it that way.
      # One combination failing should not hide the state of the others.
      fail-fast: false
      matrix:
        compiler: [gcc-14, gcc-15, clang]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM and lld
        run: |
          sudo apt-get update
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y \
            "llvm-$LLVM_VERSION" \
            "llvm-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION"

      - name: Put llc and ld.lld on PATH under their unversioned names
        # The driver spawns these two by name through PATH
        # (llvm::sys::findProgramByName), and apt.llvm.org installs them
        # versioned, so without this every compile-and-run test fails at the
        # point plang tries to assemble or link.
        run: |
          sudo ln -sf "/usr/bin/llc-$LLVM_VERSION"    /usr/local/bin/llc
          sudo ln -sf "/usr/bin/ld.lld-$LLVM_VERSION" /usr/local/bin/ld.lld
          llc --version | head -3
          ld.lld --version

      - name: Install build dependencies
        run: sudo apt-get install -y ninja-build libgtest-dev

      - name: Select the compiler
        # C++23 is required.  The clang the LLVM install already brought in is
        # new enough on its own; the GCCs come from the toolchain PPA, since a
        # runner image only carries one or two of them.
        run: |
          case "${{ matrix.compiler }}" in
            gcc-*)
              ver="${{ matrix.compiler }}"
              ver="${ver#gcc-}"
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt-get update
              sudo apt-get install -y "gcc-$ver" "g++-$ver"
              echo "CC=gcc-$ver"   >> "$GITHUB_ENV"
              echo "CXX=g++-$ver"  >> "$GITHUB_ENV"
              ;;
            clang)
              echo "CC=clang-$LLVM_VERSION"    >> "$GITHUB_ENV"
              echo "CXX=clang++-$LLVM_VERSION" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Show the compiler version
        # Printed so the log says exactly which build of the compiler gave the
        # result, which is the whole point of the gcc-14 against gcc-15 run.
        run: $CXX --version

      - name: Check the C runtime startup files are where the driver looks
        # detectGCC() wants /usr/lib/gcc/<triple>/<ver>/crtbeginS.o and a libc
        # directory holding Scrt1.o.  Both come with the runner's gcc, but a
        # failure here is far easier to read than "could not detect GCC
        # installation" from the far end of the test suite.
        run: |
          ls /usr/lib/gcc/x86_64-linux-gnu/*/crtbeginS.o
          ls /usr/lib/x86_64-linux-gnu/Scrt1.o

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPLANG_ENABLE_TESTS=ON \
            -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure

      - name: Check the install rules
        # Compiling something with the installed binary rather than only asking
        # it for its version: the driver finds its runtime library relative to
        # its own path, so an install that puts the two in the wrong relation
        # still answers --version perfectly well and cannot compile anything.
        run: |
          sudo cmake --install build --prefix /usr/local
          command -v plang
          plang --version
          man -w plang
          printf 'program hello(output);\nbegin writeln(%s) end.\n' "'ok'" > hello.pas
          plang hello.pas -o hello
          test "$(./hello)" = "ok"

  libcxx:
    name: libc++ (compile only)
    # Every other job builds against libstdc++, which left plang relying on
    # things libc++ does not give it: std::views::enumerate, which libc++ has
    # not implemented, and std::inserter, which libstdc++ happens to drag in
    # through another header and libc++ does not.  Neither showed up until
    # somebody built on macOS, where clang uses libc++.  This job is that
    # build, minus the parts of it that are specific to macOS.
    #
    # Compile only, because it cannot link: the libLLVM from apt.llvm.org is
    # built against libstdc++, so its symbols and ours disagree about which
    # std::string is meant.  Homebrew's LLVM is built against libc++ and links
    # perfectly well, and compiling is where these failures happen anyway.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM, lld and libc++
        run: |
          sudo apt-get update
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y \
            "llvm-$LLVM_VERSION" \
            "llvm-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION" \
            "libc++-$LLVM_VERSION-dev" \
            "libc++abi-$LLVM_VERSION-dev"

      - name: Install build dependencies
        run: sudo apt-get install -y ninja-build

      - name: Configure against libc++
        run: |
          cmake -S . -B build-libcxx -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm"
        env:
          CC: clang-22
          CXX: clang++-22

      - name: Compile every translation unit
        # The object libraries between them hold every source file the compiler
        # is built from, so this misses nothing that a full build would catch
        # short of the link.
        run: |
          cmake --build build-libcxx -j"$(nproc)" --target \
            PlangAST PlangBasic PlangCodeGen PlangDriver PlangFrontend \
            PlangLex PlangLocale PlangParse PlangSema

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM and lld
        run: |
          sudo apt-get update
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y \
            "llvm-$LLVM_VERSION" \
            "llvm-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION"

      - name: Put llc and ld.lld on PATH under their unversioned names
        run: |
          sudo ln -sf "/usr/bin/llc-$LLVM_VERSION"    /usr/local/bin/llc
          sudo ln -sf "/usr/bin/ld.lld-$LLVM_VERSION" /usr/local/bin/ld.lld

      - name: Install build dependencies
        run: sudo apt-get install -y ninja-build libgtest-dev

      - name: Configure
        # vptr is disabled inside the build itself: the libraries are built
        # -fno-rtti by LLVM convention and that check needs RTTI.
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPLANG_ENABLE_TESTS=ON \
            -DPLANG_SANITIZE=address,undefined \
            -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm"
        env:
          CC: clang-22
          CXX: clang++-22

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build-asan -j"$(nproc)" --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

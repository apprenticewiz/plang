name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a branch makes the run already going on it redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_VERSION: '22'

jobs:
  build:
    name: ${{ matrix.arch }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # gcc-14 and gcc-15 are both here to hold the README to "GCC >= 14".
      # They are the versions that reject, and then crash on, lambdas taking an
      # explicit object parameter that name a member of the enclosing class;
      # this builds without one, and these two runs are what keeps it that way.
      # One combination failing should not hide the state of the others.
      fail-fast: false
      matrix:
        arch: [x86_64]
        compiler: [gcc-14, gcc-15, clang]
        build_type: [Debug, Release]
        include:
          # Attaches the runner to every x86_64 combination above.
          - arch: x86_64
            runner: ubuntu-latest
          # aarch64 Linux.  Two combinations rather than six: what differs by
          # architecture is code generation and the driver's idea of the host
          # -- linker emulation, dynamic loader, crt paths, data layout -- and
          # none of that varies with which C++ compiler built plang.  One GCC
          # and one clang, one Debug and one Release, covers the axes that
          # matter here.  The gcc-14/gcc-15 pair is about a C++ front-end bug
          # and is architecture-independent, so it stays on x86_64 alone.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            compiler: gcc-15
            build_type: Debug
          - arch: aarch64
            runner: ubuntu-24.04-arm
            compiler: clang
            build_type: Release

    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM and lld
        run: |
          sudo apt-get update
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y \
            "llvm-$LLVM_VERSION" \
            "llvm-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION"

      - name: Put llc and ld.lld on PATH under their unversioned names
        # The driver spawns these two by name through PATH
        # (llvm::sys::findProgramByName), and apt.llvm.org installs them
        # versioned, so without this every compile-and-run test fails at the
        # point plang tries to assemble or link.
        run: |
          sudo ln -sf "/usr/bin/llc-$LLVM_VERSION"    /usr/local/bin/llc
          sudo ln -sf "/usr/bin/ld.lld-$LLVM_VERSION" /usr/local/bin/ld.lld
          llc --version | head -3
          ld.lld --version

      - name: Install build dependencies
        run: sudo apt-get install -y ninja-build libgtest-dev

      - name: Install psutil (test/, issue #189)
        # CMake's own find_program(HINTS LLVM_TOOLS_BINARY_DIR) resolves lit
        # to apt.llvm.org's own bundled copy for every ctest-mediated
        # invocation in this job -- and that copy's per-test timeout support
        # (test/CMakeLists.txt's `--timeout 300`, added for #189) hard-
        # requires psutil, which apt.llvm.org's package does not bring in.
        # Without this, every lit-* ctest entry fails immediately with
        # "Setting a timeout per test not supported."
        run: pip3 install --user --break-system-packages psutil

      - name: Select the compiler
        # C++23 is required.  The clang the LLVM install already brought in is
        # new enough on its own; the GCCs come from the toolchain PPA, since a
        # runner image only carries one or two of them.
        run: |
          case "${{ matrix.compiler }}" in
            gcc-*)
              ver="${{ matrix.compiler }}"
              ver="${ver#gcc-}"
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt-get update
              sudo apt-get install -y "gcc-$ver" "g++-$ver"
              echo "CC=gcc-$ver"   >> "$GITHUB_ENV"
              echo "CXX=g++-$ver"  >> "$GITHUB_ENV"
              ;;
            clang)
              echo "CC=clang-$LLVM_VERSION"    >> "$GITHUB_ENV"
              echo "CXX=clang++-$LLVM_VERSION" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Show the compiler version
        # Printed so the log says exactly which build of the compiler gave the
        # result, which is the whole point of the gcc-14 against gcc-15 run.
        run: $CXX --version

      - name: Check the C runtime startup files are where the driver looks
        # detectGCC() wants /usr/lib/gcc/<triple>/<ver>/crtbeginS.o and a libc
        # directory holding Scrt1.o.  Both come with the runner's gcc, but a
        # failure here is far easier to read than "could not detect GCC
        # installation" from the far end of the test suite.
        #
        # The triple is asked of gcc rather than written out, because this step
        # now runs on two architectures and detectGCC() derives it from the host
        # the same way.  Hard-coding x86_64-linux-gnu here would have passed on
        # aarch64 by never being true.
        run: |
          triple="$(gcc -dumpmachine)"
          echo "host triple: $triple"
          ls /usr/lib/gcc/"$triple"/*/crtbeginS.o
          ls /usr/lib/"$triple"/Scrt1.o

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPLANG_ENABLE_TESTS=ON \
            -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure

      - name: Check the install rules
        # Compiling something with the installed binary rather than only asking
        # it for its version: the driver finds its runtime library relative to
        # its own path, so an install that puts the two in the wrong relation
        # still answers --version perfectly well and cannot compile anything.
        run: |
          sudo cmake --install build --prefix /usr/local
          command -v plang
          plang --version
          man -w plang
          printf 'program hello(output);\nbegin writeln(%s) end.\n' "'ok'" > hello.pas
          plang hello.pas -o hello
          test "$(./hello)" = "ok"
          # The message catalogs.  Falling back to English is deliberate and
          # total, so a catalog installed where plang cannot find it leaves a
          # compiler that works perfectly and is silently never translated --
          # invisible to every check above.  qps_ploc is not a language: every
          # message is the English wrapped in [! !], so grepping for the
          # sentinel is the one positive proof that a catalog was found, read
          # and used.  Both halves are checked: the driver and the -pc1 child
          # are separate processes and each resolves its own.
          plang --version | grep -q 'Messages: en_US (built-in)'
          # The installed path specifically.  Two weaker forms of this check
          # both pass on a broken install: matching the tag alone passes
          # because --version names the language it was asked for even when
          # it found nothing, and matching any .po passes because the build
          # tree is still on disk and is the compiled-in fallback.  Only the
          # prefix says the install put the catalogs where plang looks.
          LC_ALL=qps_ploc plang --version \
            | grep -q 'Messages: qps_ploc (/usr/local/share/plang/locale/qps_ploc.po)'
          LC_ALL=qps_ploc plang 2>&1 | grep -q '\[!no input files!\]'
          printf 'program bad(output);\nbegin x := 1 end.\n' > bad.pas
          LC_ALL=qps_ploc plang bad.pas -o bad 2>&1 | grep -q '\[!'
          # ... and that the sentinel is absent without the locale, so the
          # grep above cannot pass for some reason unrelated to the catalog.
          ! plang bad.pas -o bad 2>&1 | grep -q '\[!'
          # Turbo Tier 4, Cluster B item 4: the shipped RTL's own install
          # path. No real standard-library unit exists yet (Crt/Dos/Printer/
          # Strings are a later cluster) -- share/plang/units/InstallProbeUnit.pas
          # is a deliberately tiny placeholder whose only job is to prove
          # unitSearchPaths()'s default tier (<exeDir>/../lib/plang/units)
          # resolves a real `uses` clause from a real installed prefix, with
          # NO -I and NO PLANG_UNIT_DIR -- the one tier lit's own suite
          # cannot reach, since it always runs the in-tree build-dir binary.
          test -f /usr/local/lib/plang/units/InstallProbeUnit.pas
          printf 'program usesprobe(output);\nuses InstallProbeUnit;\nbegin writeln(InstallProbeAnswer) end.\n' > usesprobe.pas
          plang -std=turbo usesprobe.pas -o usesprobe
          test "$(./usesprobe)" = "42"
          # Turbo Tier 4 capstone: the tier's own full end-to-end claim,
          # made real -- Crt, Dos and Strings all `uses`d together in ONE
          # program, auto-linked from this REAL installed prefix with NO -I
          # and NO PLANG_UNIT_DIR (the InstallProbeUnit check above only
          # proves this for a const-only placeholder with no object code;
          # Crt/Dos/Strings each need a real .o found and linked the same
          # way).  The program does real work through all three: Crt emits
          # a real ANSI color escape (TextColor), Dos.FindFirst/FindNext
          # iterate a real fixture directory, and Strings.StrPCopy/StrUpper
          # round-trip a real PChar buffer.  test/Turbo/Units/shipped-rtl-
          # crt-dos-strings-combined-utility.pas is the equivalent proof
          # against the build-tree units (the one lit itself can reach,
          # via -I%plang_unit_dir); this is the "installed, no flags" half
          # lit cannot do on its own (see that test's own header comment).
          mkdir -p rtlprobe
          printf 'x' > rtlprobe/one.txt
          cat > usesrtl.pas <<'PASEOF'
          program UsesRtlNoFlags(output);
          uses Crt, Dos, Strings;
          var
            F: SearchRec;
            Buf: array[0..20] of Char;
            P: PChar;
            S: string;
            Count: Integer;
          begin
            TextColor(Green);
            Count := 0;
            FindFirst('rtlprobe/*.txt', faAnyFile, F);
            while DosError = 0 do
            begin
              Count := Count + 1;
              FindNext(F);
            end;
            FindClose(F);
            S := 'widget';
            P := StrPCopy(Buf, S);
            P := StrUpper(P);
            Writeln('count=', Count, ' upper=', P);
          end.
          PASEOF
          plang -std=turbo usesrtl.pas -o usesrtl
          test "$(./usesrtl | sed -E $'s/\x1b\\[[0-9;]*m//g')" = "count=1 upper=WIDGET"

  macos:
    name: macOS / ${{ matrix.build_type }}
    # The arm64 runner, which is what macos-latest is, so this is also the
    # AArch64 coverage the Linux jobs do not have: everything else here runs on
    # x86-64.  Apple's clang and libc++ are the ones a Mac already has, and are
    # what someone building plang on one will use, so the job does not bring
    # its own compiler; Homebrew supplies LLVM, which plang links against, and
    # GoogleTest.
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM and GoogleTest
        run: brew install "llvm@$LLVM_VERSION" googletest

      - name: Put llc on PATH
        # The driver spawns llc by name through PATH, and Homebrew keeps it in
        # the keg rather than linking it into the prefix.  ld needs no such
        # help: the driver asks xcrun where the system one is.
        run: |
          echo "$(brew --prefix "llvm@$LLVM_VERSION")/bin" >> "$GITHUB_PATH"

      - name: Install lit
        # A pure Python package, so `pip install` unconditionally resolves it
        # regardless of what a given Homebrew formula bundles.
        run: |
          pip3 install --user --break-system-packages lit psutil
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Build FileCheck, not, split-file from LLVM source (test/, issue #34)
        # Confirmed for real, not assumed: Homebrew's llvm formula is built
        # with LLVM_INCLUDE_UTILS effectively off (no `find` across the whole
        # keg locates any of the three), and the official upstream release
        # tarball for this exact platform/version omits them too (downloaded
        # and inspected it directly -- 163 other tools present, none of
        # these three) -- neither distribution channel ships LLVM's own
        # testing utilities anywhere on macOS. No amount of searching harder
        # finds a binary that was never built. A pure-Python FileCheck
        # reimplementation exists on PyPI, but would behave slightly
        # differently from the real tool every other CI platform uses --
        # rejected in favor of building the actual thing, which turns out to
        # be cheap: a sparse, blob-filtered, depth-1 clone of just the
        # pieces these 3 small utilities need (not the whole llvm-project
        # monorepo, and deliberately not llvm/test/, which alone is >1 GB)
        # configures in ~4s and builds in ~8s (measured locally on Linux;
        # comparable order of magnitude expected on macOS, and dwarfed by
        # the ~2 GB / 3+ minute Homebrew llvm install this same job already
        # pays for). Pinned to the exact version Homebrew just installed --
        # not a hardcoded version -- so this can never silently drift out of
        # sync with the rest of the toolchain this job builds against.
        run: |
          LLVM_FULL_VERSION="$(brew list --versions "llvm@$LLVM_VERSION" | awk '{print $NF}')"
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "llvmorg-$LLVM_FULL_VERSION" \
            https://github.com/llvm/llvm-project.git llvm-filecheck-src
          git -C llvm-filecheck-src sparse-checkout set \
            cmake llvm/cmake llvm/utils llvm/include llvm/lib \
            llvm/tools llvm/projects llvm/runtimes third-party/siphash
          cmake -S llvm-filecheck-src/llvm -B llvm-filecheck-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_INCLUDE_UTILS=ON \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TOOLS=OFF
          ninja -C llvm-filecheck-build FileCheck not split-file
          echo "PLANG_CI_FILECHECK=$PWD/llvm-filecheck-build/bin/FileCheck" >> "$GITHUB_ENV"
          echo "PLANG_CI_NOT=$PWD/llvm-filecheck-build/bin/not" >> "$GITHUB_ENV"
          echo "PLANG_CI_SPLIT_FILE=$PWD/llvm-filecheck-build/bin/split-file" >> "$GITHUB_ENV"

      - name: Show the toolchain
        run: |
          c++ --version
          llc --version | head -3
          xcrun --show-sdk-path
          xcrun --show-sdk-version
          lit --version
          "$PLANG_CI_FILECHECK" --version

      - name: Configure
        # CMAKE_PREFIX_PATH so that find_package(GTest) looks in the Homebrew
        # prefix, which is not one of the places CMake searches by default.
        # FILECHECK_EXECUTABLE/NOT_EXECUTABLE/SPLIT_FILE_EXECUTABLE: point
        # test/CMakeLists.txt's own find_program() calls straight at the
        # three binaries the previous step just built, matching those
        # variables' real names in that file exactly -- a CMake variable
        # that's already set short-circuits find_program's own search, so
        # there's no PATH-ordering ambiguity with whatever else might be
        # named "not" on a stock macOS image.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPLANG_ENABLE_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DLLVM_DIR="$(brew --prefix "llvm@$LLVM_VERSION")/lib/cmake/llvm" \
            -DFILECHECK_EXECUTABLE="$PLANG_CI_FILECHECK" \
            -DNOT_EXECUTABLE="$PLANG_CI_NOT" \
            -DSPLIT_FILE_EXECUTABLE="$PLANG_CI_SPLIT_FILE"

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build -j"$(sysctl -n hw.ncpu)" --output-on-failure

      - name: Check the install rules
        # As on Linux: compiling with the installed binary, because the driver
        # finds its runtime library relative to its own path and an install
        # that puts the two in the wrong relation still answers --version.
        # This also proves the @loader_path rpath, since the installed binary
        # loads libplang-frontend through it.
        run: |
          sudo cmake --install build --prefix /usr/local
          command -v plang
          plang --version
          man -w plang
          printf 'program hello(output);\nbegin writeln(%s) end.\n' "'ok'" > hello.pas
          plang hello.pas -o hello
          test "$(./hello)" = "ok"
          # The message catalogs.  Falling back to English is deliberate and
          # total, so a catalog installed where plang cannot find it leaves a
          # compiler that works perfectly and is silently never translated --
          # invisible to every check above.  qps_ploc is not a language: every
          # message is the English wrapped in [! !], so grepping for the
          # sentinel is the one positive proof that a catalog was found, read
          # and used.  Both halves are checked: the driver and the -pc1 child
          # are separate processes and each resolves its own.
          plang --version | grep -q 'Messages: en_US (built-in)'
          # The installed path specifically.  Two weaker forms of this check
          # both pass on a broken install: matching the tag alone passes
          # because --version names the language it was asked for even when
          # it found nothing, and matching any .po passes because the build
          # tree is still on disk and is the compiled-in fallback.  Only the
          # prefix says the install put the catalogs where plang looks.
          LC_ALL=qps_ploc plang --version \
            | grep -q 'Messages: qps_ploc (/usr/local/share/plang/locale/qps_ploc.po)'
          LC_ALL=qps_ploc plang 2>&1 | grep -q '\[!no input files!\]'
          printf 'program bad(output);\nbegin x := 1 end.\n' > bad.pas
          LC_ALL=qps_ploc plang bad.pas -o bad 2>&1 | grep -q '\[!'
          # ... and that the sentinel is absent without the locale, so the
          # grep above cannot pass for some reason unrelated to the catalog.
          ! plang bad.pas -o bad 2>&1 | grep -q '\[!'
          # Turbo Tier 4, Cluster B item 4: the shipped RTL's own install
          # path. No real standard-library unit exists yet (Crt/Dos/Printer/
          # Strings are a later cluster) -- share/plang/units/InstallProbeUnit.pas
          # is a deliberately tiny placeholder whose only job is to prove
          # unitSearchPaths()'s default tier (<exeDir>/../lib/plang/units)
          # resolves a real `uses` clause from a real installed prefix, with
          # NO -I and NO PLANG_UNIT_DIR -- the one tier lit's own suite
          # cannot reach, since it always runs the in-tree build-dir binary.
          test -f /usr/local/lib/plang/units/InstallProbeUnit.pas
          printf 'program usesprobe(output);\nuses InstallProbeUnit;\nbegin writeln(InstallProbeAnswer) end.\n' > usesprobe.pas
          plang -std=turbo usesprobe.pas -o usesprobe
          test "$(./usesprobe)" = "42"
          # Turbo Tier 4 capstone: the tier's own full end-to-end claim,
          # made real -- Crt, Dos and Strings all `uses`d together in ONE
          # program, auto-linked from this REAL installed prefix with NO -I
          # and NO PLANG_UNIT_DIR (the InstallProbeUnit check above only
          # proves this for a const-only placeholder with no object code;
          # Crt/Dos/Strings each need a real .o found and linked the same
          # way).  The program does real work through all three: Crt emits
          # a real ANSI color escape (TextColor), Dos.FindFirst/FindNext
          # iterate a real fixture directory, and Strings.StrPCopy/StrUpper
          # round-trip a real PChar buffer.  test/Turbo/Units/shipped-rtl-
          # crt-dos-strings-combined-utility.pas is the equivalent proof
          # against the build-tree units (the one lit itself can reach,
          # via -I%plang_unit_dir); this is the "installed, no flags" half
          # lit cannot do on its own (see that test's own header comment).
          mkdir -p rtlprobe
          printf 'x' > rtlprobe/one.txt
          cat > usesrtl.pas <<'PASEOF'
          program UsesRtlNoFlags(output);
          uses Crt, Dos, Strings;
          var
            F: SearchRec;
            Buf: array[0..20] of Char;
            P: PChar;
            S: string;
            Count: Integer;
          begin
            TextColor(Green);
            Count := 0;
            FindFirst('rtlprobe/*.txt', faAnyFile, F);
            while DosError = 0 do
            begin
              Count := Count + 1;
              FindNext(F);
            end;
            FindClose(F);
            S := 'widget';
            P := StrPCopy(Buf, S);
            P := StrUpper(P);
            Writeln('count=', Count, ' upper=', P);
          end.
          PASEOF
          plang -std=turbo usesrtl.pas -o usesrtl
          test "$(./usesrtl | sed -E $'s/\x1b\\[[0-9;]*m//g')" = "count=1 upper=WIDGET"

  optimized:
    name: emitted programs at -O1/-O2/-O3
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The suite compiles the programs it runs at -O0, and so does the
    # acceptance test.  A defect that only the optimizer acts on is therefore
    # invisible to all 1,795 of them.
    #
    # That is not hypothetical.  A `packed record` field was emitted with the
    # alignment of its own type rather than the record's, so a `set of char` at
    # an odd offset produced `store i256 ..., align 16` -- true at -O0, where
    # the backend used scalar moves, and fatal from -O1, where it emits
    # `movaps`.  iso7185pat.pas, the project's own acceptance program, died at
    # -O2 after 935 of its 1,211 lines and had done since the beginning.
    #
    # PLANG_TEST_EXTRA_FLAGS changes what the tests tell plang to do, not how
    # plang itself is built, so one build serves all three levels.
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM and lld
        run: |
          sudo apt-get update
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y \
            "llvm-$LLVM_VERSION" \
            "llvm-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION"

      - name: Put llc and ld.lld on PATH under their unversioned names
        run: |
          sudo ln -sf "/usr/bin/llc-$LLVM_VERSION"    /usr/local/bin/llc
          sudo ln -sf "/usr/bin/ld.lld-$LLVM_VERSION" /usr/local/bin/ld.lld

      - name: Install build dependencies
        run: sudo apt-get install -y ninja-build libgtest-dev

      - name: Install lit (test/, issue #34)
        # CMake's own find_program(HINTS LLVM_TOOLS_BINARY_DIR) already
        # resolves lit/FileCheck for every ctest-mediated invocation in this
        # job (the CTest command line bakes in the fully-resolved path found
        # at configure time), which is why the plain, unfiltered ctest runs
        # below already exercise test/ correctly with no extra step.
        # This job also invokes `lit` directly from a bare shell (the
        # guardheap step further down), which has no such resolution and
        # needs lit on PATH for real -- confirmed apt.llvm.org's package
        # does not put it there. Same fix as the macOS job's identical need:
        # pip install unconditionally resolves it regardless of what a given
        # LLVM package bundles.
        run: |
          pip3 install --user --break-system-packages lit psutil
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Configure
        # plang requires C++23, and the runner image's default compiler is not
        # new enough -- it has no <print>.  Every other job selects a compiler
        # explicitly; this one did not, and failed at the build step for three
        # commits.  The clang the LLVM install above already brought in is new
        # enough on its own, which is what the sanitizers job relies on too.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLANG_ENABLE_TESTS=ON \
            -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm"
        env:
          CC: clang-22
          CXX: clang++-22

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The memory-safety gate is only worth its exit code if it can still tell
      # a valid program from an over-run.  It could not, once: it faulted on
      # any pointer it had not allocated, and was being used to decide whether
      # real defects were real.
      - name: Guard-page allocator self-test
        run: bash test/tools/run-under-guardheap.sh --self-test

      # Runs a schema/variant/pointer/string-heavy subset of emitted programs
      # under the guard-page allocator above -- this is the only thing in CI
      # that would catch a regression of the bug class documented at
      # test/CodeGen/Shadowing/an-initial-state-comes-from-the-component-type-that-was-written.pas
      # and test/EP/EP7Schema/a-nested-instantiation-smaller-than-the-probe-stays-inside-its-allocation.pas:
      # an over-run into heap nothing else reads exits 0 printing the right
      # value everywhere except here. Default flags, not folded into the
      # -O1/-O2/-O3 axis below: both known instances of this bug class are
      # allocation-size/layout defects independent of optimization level.
      #
      # lit only, no GTest step: codegen_test.cpp, ep_test.cpp,
      # module_test.cpp, and driver_test.cpp (issue #34) have all migrated to
      # test/{CodeGen,EP,Module,Driver}/ -- single coarse-grained `lit-*`
      # CTest entries that `ctest -R` can no longer subset by keyword, so this
      # subset is re-run directly through `lit --filter` instead. No GTest
      # binary remains in test/Driver/ at all.
      - name: Test schema/variant/pointer/string subset under guardheap (lit)
        run: |
          cd build/test
          lit -sv --skip-test-time-recording --timeout 300 --filter='Schema|VariantRecord|VariantPart|ConformantArray|Shadowing|Storage|String|Substr|Pointer' CodeGen EP Module Driver
        env:
          PLANG_TEST_RUN_WRAPPER: "bash ${{ github.workspace }}/test/tools/run-under-guardheap.sh"

      - name: Test with emitted programs at -O1
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure
        env:
          PLANG_TEST_EXTRA_FLAGS: -O1

      - name: Test with emitted programs at -O2
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure
        env:
          PLANG_TEST_EXTRA_FLAGS: -O2

      - name: Test with emitted programs at -O3
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure
        env:
          PLANG_TEST_EXTRA_FLAGS: -O3

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM and lld
        run: |
          sudo apt-get update
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y \
            "llvm-$LLVM_VERSION" \
            "llvm-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION"

      - name: Put llc and ld.lld on PATH under their unversioned names
        run: |
          sudo ln -sf "/usr/bin/llc-$LLVM_VERSION"    /usr/local/bin/llc
          sudo ln -sf "/usr/bin/ld.lld-$LLVM_VERSION" /usr/local/bin/ld.lld

      - name: Install build dependencies
        run: sudo apt-get install -y ninja-build libgtest-dev

      - name: Install psutil (test/, issue #189)
        # Same need as the build job's identical step: ctest-mediated lit
        # invocations here resolve to apt.llvm.org's bundled lit, whose
        # per-test timeout support requires psutil.
        run: pip3 install --user --break-system-packages psutil

      - name: Configure
        # vptr is disabled inside the build itself: the libraries are built
        # -fno-rtti by LLVM convention and that check needs RTTI.
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPLANG_ENABLE_TESTS=ON \
            -DPLANG_SANITIZE=address,undefined \
            -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm"
        env:
          CC: clang-22
          CXX: clang++-22

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build-asan -j"$(nproc)" --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  lint-test:
    name: lint test/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No C++ build needed: pure Python text analysis over test/**/*.pas
    # (issue #43's own repeat-offense history -- a stray '}' closing a
    # directive comment early, hit at least 4 times; a bare %t defeating
    # PLANG_TEST_RUN_WRAPPER, hit at scale once, 282 files). Deliberately
    # its own job, not a step tacked onto `build`: it has nothing to do
    # with any compiler/arch/build_type axis, and it should fail fast
    # without waiting on a full compiler matrix to say so.
    steps:
      - uses: actions/checkout@v5

      - name: Lint test/
        run: python3 tools/lint_test.py --strict
